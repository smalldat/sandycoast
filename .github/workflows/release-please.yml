name: Release Please

# Maintains a rolling "release PR" from Conventional Commits on main.
# Merging that PR bumps package.json, updates CHANGELOG.md, tags the commit,
# and publishes a GitHub Release. The Release "published" event then triggers
# publish.yml, which pushes the package to npm.

on:
  push:
    branches: [main]

permissions:
  contents: write # create tags, releases, and the release PR's commits
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
