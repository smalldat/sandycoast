name: Deploy site to Firebase Hosting (GCP smalldat)

# Builds the playground demo as a static site and deploys it to Firebase
# Hosting in the GCP project `smalldat`, served at https://sandycoast.smalldat.com.
# Auth is keyless via Workload Identity Federation — no long-lived JSON key.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Serialize deploys; cancel an in-flight run if a newer commit lands.
concurrency:
  group: deploy-hosting
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build:site

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only hosting \
            --project smalldat \
            --non-interactive \
            --message "gha ${GITHUB_SHA::7}"
