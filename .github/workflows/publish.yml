name: Release (publish npm + deploy site)

# Runs when a release/* branch is pushed/created. Builds the package and
# publishes it to npm, then builds the static site and deploys it to Firebase
# Hosting in the GCP project `smalldat`.
#
# Requires:
#   - NPM_TOKEN secret (npm automation token with publish rights)
#   - GCP_WIF_PROVIDER / GCP_DEPLOY_SA secrets (Workload Identity Federation)

on:
  push:
    branches: ['release/**']
  workflow_dispatch: {}

# Serialize releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm provenance + Workload Identity Federation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      # Auth via OIDC Trusted Publishing — no NPM_TOKEN. Requires a trusted
      # publisher configured on npmjs for this repo + workflow, and the
      # id-token: write permission set above. Provenance is automatic.
      - name: Publish to npm
        run: npm publish --access public

      - name: Build static site
        run: npm run build:site

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only hosting:sandycoast \
            --project smalldat \
            --non-interactive \
            --message "release ${GITHUB_SHA::7}"
