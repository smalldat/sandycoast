name: CI

# Fast checks on every PR and push to main: typecheck, lint, unit tests. No
# Playwright container or build step — see e2e.yml for the slower browser suite.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
