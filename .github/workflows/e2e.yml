name: E2E

# Component-level E2E for the charts (see plans/08-e2e-test-infrastructure.md).
# `workflow_call` lets publish.yml gate a release on this passing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Pinned to the installed @playwright/test version: browser binaries are
    # baked into the image, and screenshot baselines (once added) are only
    # valid for the exact image they were generated from.
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck e2e
        run: npm run typecheck:e2e

      # Needed by the `packaged` project (tests dist/index.js, not src/index.ts).
      - run: npm run build

      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
